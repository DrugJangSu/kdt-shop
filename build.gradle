plugins {
    id 'java'                                              // 순수 Java 프로젝트 기능(compileJava, test 등)
    id 'org.springframework.boot' version '4.1.2'          // Spring Boot 플러그인(bootRun, bootJar 등)
    id 'io.spring.dependency-management' version '1.1.7'   // Spring Boot BOM으로 라이브러리 버전을 자동 관리
}

group = 'com.kdt'
version = '0.0.1-SNAPSHOT'
description = 'kdt-shop'

java {
    toolchain {
        // 이 프로젝트의 Java 버전을 21로 고정한다.
        // (내 PC에 다른 Java가 설치되어 있어도 Gradle이 Java 21을 찾아서 사용한다.)
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// QueryDSL 버전을 변수로 빼 두면 아래 의존성 두 곳에서 같은 버전을 재사용할 수 있다.
def querydslVersion = '7.7'

repositories {
    mavenCentral()
}

dependencies {
    // [키워드 설명]
    //  - implementation     : 컴파일 + 실행 모두에 필요한 라이브러리 (가장 흔한 형태)
    //  - compileOnly        : 컴파일할 때만 필요하고, 실행(jar)에는 포함하지 않음
    //  - runtimeOnly        : 코드에서 직접 쓰진 않지만, 실행할 때 필요함
    //  - annotationProcessor: 컴파일 중에 코드를 자동 생성해 주는 도구
    //  - test~              : 위 키워드들의 "테스트 코드 전용" 버전 (테스트할 때만 사용)
    // [starter란?] 관련 라이브러리 여러 개를 한 번에 묶어 둔 "세트 상품". 버전도 Spring Boot가 알아서 맞춰 준다.

    // --- Spring / JPA / DB 기본 의존성 -------------------------------------
    // Spring Data JPA + Hibernate: 자바 객체(@Entity)로 DB를 다루게 해 준다. SQL을 직접 안 써도 저장/조회 가능
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring MVC: 웹 API 서버를 만드는 기본 도구. @RestController, @GetMapping, JSON 응답 등을 사용 가능 (내장 Tomcat 포함)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // RestClient: 우리 서버에서 "다른 서버의 API를 호출"할 때 쓰는 HTTP 클라이언트 (외부 API 연동용)
    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // Swagger UI: 컨트롤러를 읽어 API 문서를 만들고, 브라우저에서 직접 요청해 볼 수 있게 해 준다   ← 추가
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // Lombok(컴파일용): @Getter, @Setter, @Builder 등으로 반복되는 보일러플레이트 코드를 줄여 준다.
    // 컴파일할 때만 필요하므로 compileOnly (실행 시에는 이미 코드가 생성된 상태)
    compileOnly 'org.projectlombok:lombok'

    // MySQL JDBC 드라이버: 자바가 MySQL DB와 통신하게 해 주는 "통역사". 실행할 때만 필요해서 runtimeOnly
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok(코드 생성기): 위 어노테이션(@Getter 등)을 읽어 실제 getter/생성자 코드를 만들어 낸다.
    // (compileOnly와 항상 짝으로 써야 Lombok이 동작한다)
    annotationProcessor 'org.projectlombok:lombok'

    // --- 테스트 의존성 -----------------------------------------------------
    // JPA 테스트 도구: @DataJpaTest 등으로 Repository(DB 접근 계층)만 가볍게 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // MVC 테스트 도구: MockMvc 등으로 Controller(API)를 서버 띄우지 않고 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // 테스트 코드 안에서도 Lombok을 쓰기 위한 설정 (아래 testAnnotationProcessor와 짝)
    testCompileOnly 'org.projectlombok:lombok'

    // JUnit 테스트 실행기: Gradle이 JUnit 테스트를 찾아서 실행할 때 필요 (최신 Gradle에서는 명시 권장)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 테스트 코드용 Lombok 코드 생성기
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- 캐시 / Redis ------------------------------------------------------
    // Spring Cache: @Cacheable 등으로 "자주 조회하는 결과를 저장해 두고 재사용"해 응답을 빠르게 한다.
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Spring Data Redis: 메모리 기반 저장소 Redis와 연결. 캐시 저장소나 임시 데이터 저장에 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- QueryDSL ---------------------------------------------------------
    // querydsl-jpa: JPAQueryFactory, JPAQuery 같은 QueryDSL의 JPA 전용 API
    // (패키지 이름은 com.querydsl.* 이지만, 유지보수가 이어지는 OpenFeign 포크를 사용한다.)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"

    // querydsl-apt: 컴파일할 때 @Entity를 읽고 Q 클래스를 만들어 주는 "애노테이션 프로세서"
    // 뒤의 :jpa 는 JPA 엔티티용 프로세서를 고르는 classifier다.
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"

    // 애노테이션 프로세서는 컴파일러와 "별도의 클래스패스"에서 실행된다.
    // 따라서 엔티티의 @Entity, @Id, @Column 같은 Jakarta 애노테이션을 읽을 수 있도록
    // Jakarta API를 프로세서 경로에도 직접 넣어 준다. (버전은 Spring Boot BOM이 맞춰 준다.)
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

// Q 클래스가 생성될 디렉터리.
// 직접 작성하는 소스가 아니라, 컴파일 시 애노테이션 프로세서가 만들어 주는 소스다.
def querydslDir = 'src/main/generated'

sourceSets {
    // 위 디렉터리를 Java 소스 경로에 추가해야 Q 클래스도 컴파일 대상이 된다.
    main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile).configureEach {
    // 모든 Java 컴파일 작업에서 생성 소스(Q 클래스)의 출력 위치를 지정한다.
    options.generatedSourceOutputDirectory.set(file(querydslDir))
}

clean {
    // gradle clean 을 실행하면 생성된 Q 클래스도 함께 지운다.
    // (다시 compileJava를 실행하면 최신 엔티티 기준으로 재생성된다.)
    delete file(querydslDir)
}

tasks.named('test') {
    useJUnitPlatform()
}