<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 API 연결</title>
  <!-- CSS는 화면의 모양만 정한다. API 요청은 아래 script에서 보낸다. -->
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; line-height: 1.6; }
    section { margin: 24px 0; padding: 20px; border: 1px solid #bbb; border-radius: 8px; }
    label { display: block; margin-top: 12px; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
    button { margin-top: 12px; padding: 8px 16px; }
    [role="status"] { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<h1>게시글 목록과 저장</h1>
<!-- 목록은 비워 두고 GET 응답을 받은 뒤 JavaScript로 채운다. -->
<section aria-labelledby="list-heading">
  <h2 id="list-heading">게시글 목록</h2>
  <button id="refresh" type="button">목록 새로고침</button>
  <p id="page-info"></p>
  <ul id="post-list"></ul>
  <p id="list-note" role="status"></p>
</section>
<section aria-labelledby="form-heading">
  <h2 id="form-heading">새 글 저장</h2>
  <!-- 기본 폼 검증 대신 validateInput()에서 검사하고 JSON으로 제출한다. -->
  <form id="post-form" novalidate>
    <label for="title">제목 (최대 20자)</label>
    <input id="title" name="title" type="text">
    <label for="body">본문 (최대 100자)</label>
    <textarea id="body" name="body" rows="4"></textarea>
    <button id="save" type="submit">새 글 저장</button>
  </form>
  <p>마지막으로 생성 확인한 ID: <strong id="created-id">없음</strong></p>
  <p id="form-note" role="status"></p>
</section>
<!-- 입력란·버튼이 만들어진 뒤 실행해야 getElementById로 찾을 수 있다. -->
<script>
  'use strict';
  // 요청은 HTML을 제공하는 8000이 아니라 Spring API의 8080으로 보낸다.
  const API = 'http://127.0.0.1:8080/api/v1/posts';
  // HTML의 id로 요소를 찾아 보관한다. 입력값은 저장할 때 .value로 읽는다.
  const form = document.getElementById('post-form');
  // 이 줄은 입력란 요소를 찾는다. 입력 문자열을 읽는 동작과 다르다.
  const titleInput = document.getElementById('title');
  const bodyInput = document.getElementById('body');
  const saveButton = document.getElementById('save');
  const refreshButton = document.getElementById('refresh');
  const list = document.getElementById('post-list');
  const pageInfo = document.getElementById('page-info');
  const listNote = document.getElementById('list-note');
  const formNote = document.getElementById('form-note');
  const createdId = document.getElementById('created-id');
  // true인 동안에는 새 저장이나 목록 조회를 시작하지 않는다.
  let busy = false;

  // ① 이 화면에서는 처리를 하나씩 진행한다.
  function setBusy(value) {
    busy = value;
    saveButton.disabled = value;
    refreshButton.disabled = value;
  }

  // ② HTTP 요청과 응답 처리를 한곳에 모은다.
  async function request(path, options, expectedStatus) {
    let response;
    try {
      // 응답 헤더를 받으면 Response를 얻는다. 본문은 아래에서 따로 읽는다.
      response = await fetch(API + path, {
        // 호출할 때 전달한 method·body 등의 요청 옵션을 복사한다.
        ...options,
        // JSON 응답을 요청하고, POST라면 Content-Type도 추가한다.
        headers: { Accept: 'application/json', ...options.headers }
      });
    } catch (error) {
      throw new Error('통신 실패: 연결·CORS를 Network와 Console에서 확인하세요.');
    }

    // 204는 본문이 없으므로 text()나 json()을 호출하지 않는다.
    if (response.status === 204) {
      if (expectedStatus === 204) return null;
      throw new Error('HTTP 204: 기대한 상태는 ' + expectedStatus + '입니다.');
    }

    let text;
    try {
      text = await response.text(); // 응답 본문은 한 번만 읽는다.
    } catch (error) {
      throw new Error('HTTP ' + response.status + ': 응답 본문 수신 실패');
    }

    // 본문을 JSON으로 해석하지 못한 경우와 정상 JSON 응답을 구분한다.
    let data = null;
    let isJson = false;
    if (text.trim() !== '') {
      try {
        data = JSON.parse(text);
        isJson = true;
      } catch (error) { /* 아래 분기에서 상태 코드와 함께 안내한다. */ }
    }

    // fetch는 404·500에도 응답을 반환하므로 상태 코드를 직접 비교한다.
    if (response.status !== expectedStatus) {
      let detail = text.trim() === '' ? '빈 응답 본문' : '예상과 다른 응답';
      if (!isJson && text.trim() !== '') detail = 'JSON이 아닌 응답 본문';
      if (data && typeof data === 'object') {
        const parts = [];
        if (typeof data.code === 'string') parts.push(data.code);
        if (typeof data.message === 'string') parts.push(data.message);
        if (parts.length > 0) detail = parts.join(': ');
      }
      throw new Error('HTTP ' + response.status + ': ' + detail);
    }
    // 성공 상태여도 JSON 본문을 확인하지 못하면 성공 데이터를 반환하지 않는다.
    if (!isJson) {
      throw new Error('HTTP ' + response.status + ': JSON 본문을 확인할 수 없습니다.');
    }
    return data;
  }

  // ③ 입력을 검사하고 전송할 두 값만 반환한다.
  function validateInput() {
    // 현재 입력란에 적힌 문자열을 읽는다.
    const title = titleInput.value;
    const body = bodyInput.value;
    // 빈 문자열이나 공백만 있는 입력은 막는다. 원래 입력값은 바꾸지 않는다.
    if (!title.trim() || !body.trim()) {
      throw new Error('화면 입력 확인: 제목과 본문을 모두 입력하세요. POST는 보내지 않았습니다.');
    }
    // length는 JavaScript 문자열 길이이며 이모지 한 개가 2 이상일 수도 있다.
    if (title.length > 20 || body.length > 100) {
      throw new Error('화면 입력 확인: 제목 20자·본문 100자 이내로 입력하세요. POST는 보내지 않았습니다.');
    }
    // 서버에 보내기로 한 title과 body만 담는다. id나 작성자는 보내지 않는다.
    return { title: title, body: body };
  }

  // ④ 목록을 가져온 뒤 안전하게 화면에 표시한다.
  async function load() {
    listNote.textContent = '목록을 불러오는 중입니다.';
    try {
      // 첫 페이지에서 최대 두 건을 조회한다. no-store는 브라우저 HTTP 캐시 설정이다.
      const data = await request('?page=0&size=2', { cache: 'no-store' }, 200);
      if (!data || !Array.isArray(data.content)) {
        throw new Error('HTTP 200: 응답에 content 배열이 없습니다.');
      }
      // 새 응답을 표시하기 전에 이전 목록 항목을 지워 중복을 막는다.
      list.replaceChildren();
      for (const row of data.content) {
        const li = document.createElement('li');
        // 서버에서 받은 제목을 HTML로 해석하지 않고 문자열 그대로 표시한다.
        li.textContent = `${row.id} | ${row.title} | ${row.loginId}`;
        list.append(li);
      }
      pageInfo.textContent =
              `페이지: ${data.page} / 크기: ${data.size} / 전체: ${data.totalElements}건`;
      listNote.textContent = data.content.length === 0
              ? '조회 성공(200): 첫 페이지에 게시글이 없습니다.'
              : '조회 성공(200): ' + data.content.length + '건을 표시했습니다.';
    } catch (error) {
      listNote.textContent = '목록 조회 실패: ' + error.message;
      pageInfo.textContent = '기존 목록이 보이더라도 최신 결과가 아닐 수 있습니다.';
      throw error;
    }
  }

  // ⑤ 저장 성공은 유지하고, 목록 갱신 결과만 덧붙인다.
  async function refreshAfterSuccess(message) {
    // 이미 확인한 저장·삭제 완료 문구를 먼저 표시하고, 목록 조회 결과를 덧붙인다.
    formNote.textContent = message;
    try {
      await load();
      formNote.textContent = message + '\n목록도 갱신했습니다. 제목 정렬 때문에 새 글이 첫 페이지에 없을 수 있습니다.';
    } catch (error) {
      formNote.textContent = message + '\n목록 갱신만 실패했습니다. 저장을 반복하지 말고 목록 새로고침을 사용하세요.';
    }
  }

  // ⑥ 제출: 입력 검사 → POST → 201·실제 ID 확인 → 목록 GET.
  form.addEventListener('submit', async function (event) {
    // 폼의 기본 페이지 이동을 막고 아래의 fetch로 JSON을 보낸다.
    event.preventDefault();
    if (busy) return;
    let payload;
    try {
      // 검사에 실패하면 catch에서 끝나므로 아래 POST를 보내지 않는다.
      payload = validateInput();
    } catch (error) {
      formNote.textContent = error.message;
      return;
    }

    // 저장·새로고침 버튼을 비활성화해 현재 처리가 끝날 때까지 연속 실행을 막는다.
    setBusy(true);
    formNote.textContent = '저장 요청 중입니다.';
    try {
      // POST는 한 번만 보낸다. 201 응답의 JSON을 받은 뒤 실제 ID를 검사한다.
      const saved = await request('', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // 객체를 JSON 문자열로 바꿔 HTTP 요청 본문에 넣는다.
        body: JSON.stringify(payload)
      }, 201);
      // 201이어도 ID가 없거나 안전한 양의 정수가 아니면 생성 완료로 안내하지 않는다.
      if (!saved || !Number.isSafeInteger(saved.id) || saved.id <= 0) {
        throw new Error('HTTP 201: 실제 게시글 ID를 확인할 수 없습니다.');
      }
      // 후속 목록 조회가 실패해도 확인한 생성 ID는 화면에 남긴다.
      createdId.textContent = String(saved.id);
      // 생성 응답을 확인한 뒤에만 제목·본문 입력란을 비운다.
      form.reset();
      await refreshAfterSuccess('201 생성 완료 — 게시글 ID: ' + saved.id);
    } catch (error) {
      formNote.textContent = error.message +
              '\nPOST는 자동 재전송하지 않았습니다. 저장 결과가 불명확하면 Network·DB 확인 전 다시 저장하지 마세요.';
    } finally {
      // 처리가 끝났으므로 busy를 해제하고 각 버튼의 활성화 상태를 갱신한다.
      setBusy(false);
    }
  });

  // ⑦ 처음 열 때와 새로고침 버튼에서는 GET만 실행한다.
  async function reloadList() {
    if (busy) return;
    // 저장·새로고침 버튼을 비활성화해 현재 처리가 끝날 때까지 연속 실행을 막는다.
    setBusy(true);
    try {
      await load();
    } catch (error) { /* load()가 목록 영역에 오류를 이미 표시했다. */ }
    finally {
      // 처리가 끝났으므로 busy를 해제하고 각 버튼의 활성화 상태를 갱신한다.
      setBusy(false);
    }
  }
  // 지금 호출하지 않고, 새로고침 버튼을 클릭했을 때 실행할 함수를 등록한다.
  refreshButton.addEventListener('click', reloadList);
  // 화면을 처음 열었을 때는 사용자가 버튼을 누르기 전에 목록을 한 번 조회한다.
  reloadList();
</script>
</body>
</html>
