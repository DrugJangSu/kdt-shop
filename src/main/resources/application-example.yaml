spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/YOUR_DB_NAME?sslMode=REQUIRED
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true